<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 56px; align-items: center; padding: 0 72px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--ruling) 31px, var(--ruling) 32px); }
  .og-title { font-family: var(--font-display); font-weight: 600; font-size: 92px; line-height: 1; letter-spacing: -0.03em; }
  .og-sub { margin-top: 28px; font-size: 26px; max-width: 30ch; color: var(--ink-2); }
  .og-brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 28px; margin-bottom: 36px; }
</style></head>
<body>
<div>
  <div class="og-brand"><svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="6" class="mark-bg"/><path d="M9 11h14M9 16h14M9 21h8" class="mark-lines"/><circle cx="23" cy="21" r="3" class="mark-dot"/></svg>SubZero Vault</div>
  <div class="og-title">Stop renting your reading list.</div>
  <p class="og-sub">Self-hosted read-it-later, bookmarks and a subscription audit.</p>
</div>
<figure class="ledger" style="padding: 28px">
  <div class="ledger-total"><span class="ledger-num">$239.76</span><span class="ledger-unit">a year in rent at the example prices</span></div>
  <table class="ledger-table"><tbody>
    <tr><th scope="row">Readwise Reader</th><td class="num">$9.99</td></tr>
    <tr><th scope="row">Raindrop.io Pro</th><td class="num">$3.99</td></tr>
    <tr><th scope="row">Rocket Money Premium</th><td class="num">$6.00</td></tr>
  </tbody></table>
</figure>
</body></html>
